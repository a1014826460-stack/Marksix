<body style="background:skyblue;">
<div class="container">
    <div class="linkIndex">
        <div>
            <div style="font-size: 13px;">
                <span id="hostnameSpan" style="color: #fff;"></span>为您提供
            </div>
            <div>香港天天彩开奖记录，<a href="index.html" style="color:#999; text-decoration: none">返回首页</a> </div>
        </div>
    </div>
    <div id="saveAoMenRecordcontainer"></div>
</div>
<script type="text/javascript">
    document.getElementById("hostnameSpan").innerHTML = location.hostname;
</script>
<script type="text/javascript" src="static/js/data.js"></script>
<script type="text/javascript">
    documentWriteScript();

    function documentWriteScript() {
        var year = getParams('year');
        if(!year){
            var d = new Date();
            year = d.getFullYear();
        }
        var historyJsKj466 = document.createElement("script");

        historyJsKj466.type = "text/javascript";

        historyJsKj466.onload = startAmKaijiangjilu;

        var nowTime = new Date();


        historyJsKj466.src = '/index/ajax/ttklsjl?year='+year+'&v=' + nowTime.getTime();

        document.body.appendChild(historyJsKj466);

    }

    var aoMenRecord;

    var saveAoMenRecordcontainer = document.getElementById('saveAoMenRecordcontainer');

    var weekArr = ['日', '一', '二', '三', '四', '五', '六'];


    var bottomBox;

    var indexLinkKJJL;


    function startAmKaijiangjilu() {
        aoMenRecord = historyAO["data"];
        // 放进页面里de
        var aoMenRecordcontainer = document.createElement("div");

        aoMenRecordcontainer.className = "aoMenRecordcontainer";
        var nowyear = historyAO["year"];
        var d = new Date();
        year = d.getFullYear();
        var yearhtml = '';
        for(var i = 0; i<3; i++){
            if(year-i == nowyear){
                cur = 'cur';
            }else{
                cur = '';
            }
            yearhtml += '<a href="./wylhc.html?year='+(year-i)+'" class="'+cur+'">'+(year-i)+'历史记录</a>';
        }
        aoMenRecordcontainer.innerHTML = '<div class="topBox sticky-top"><div class="topBox1">'+yearhtml+'</div><div class="topBox1"><div class="activeWay">浏览方式:</div><div class="way"><input id="in0" type="checkbox" checked="checked" onchange="lookWay(0)"><div><label for="in0">完整显示</label></div></div><div class="way"><input id="in1" type="checkbox" onchange="lookWay(1)"><div><label for="in1">只看生肖</label></div></div><div class="way"><input id="in2" type="checkbox" onchange="lookWay(2)"><div><label for="in2">只看号码</label></div></div></div><div class="topBox2"><div>搅珠日期</div><div>期数</div><div>平码(6个码)</div><div>特码</div></div></div><div class="bottomBox" id="bottomBox"></div><div id="indexLinkKJJL" style="background:khaki !important;"><a target="_blank" style=" text-decoration:none  !important;font-size:1.5em !important;" href="/index/index/history.html">点击进入查看历史开奖记录</a></div>';

        saveAoMenRecordcontainer.appendChild(aoMenRecordcontainer);

        bottomBox = document.getElementById('bottomBox');

        indexLinkKJJL = document.getElementById('indexLinkKJJL');


        if (document.querySelectorAll('meta[name=viewport]').length == 0) {

            if (IsPC()) {


            } else {


            }

        } else {

            if (IsPC()) {

                setTimeout(function () {
                    aoMenRecordcontainer.style.fontSize = "27px"
                }, 1);

            } else {

                setTimeout(function () {
                    aoMenRecordcontainer.style.fontSize = "14px"
                }, 1);

            }

        }

        setBottomBoxInnerHTML();


    }


    function setBottomBoxInnerHTML() {

        bottomBox.innerHTML = getBottomBoxInnerHTML();

        mouseOverOut();

    }


    function getBottomBoxInnerHTML() {

        var showIndexLinkKJJL = (typeof saveAoMenRecordcontainerNum) === "undefined";

        if (showIndexLinkKJJL) {

            indexLinkKJJL.style.display = 'none';

        }

        var lineBoxHtmlArr = [];

        for (var i = 0; i < (((showIndexLinkKJJL) ? false : saveAoMenRecordcontainerNum) || aoMenRecord.length); i++) {

            var date = aoMenRecord[i]["openTime"].slice(0, 10);

            var week = weekArr[new Date(date.replace(/-/g, '/')).getDay()];

            var qiNum = aoMenRecord[i]["issue"];

            var maArr = aoMenRecord[i]["openCode"].split(',').map(function (item) {
                return Number(item);
            });

            var xiaoArr = getXiaoArrByMaArr(maArr, aoMenRecord[i]["openTime"]);

            var colorArr = getColorArrByMaArr(maArr);

            var maXiaoBoxArr = '';

            for (var m = 0; m < maArr.length - 1; m++) {

                var showMa = maArr[m] < 10 ? '0' + maArr[m] : maArr[m];

                maXiaoBoxArr += '<div class="maXiaoBox"><div class="ma  ' + colorArr[m] + '">' + showMa + '</div><div class="xiao">' + xiaoArr[m] + '</div></div>';

            }

            var showTeMa = maArr[6] < 10 ? '0' + maArr[6] : maArr[6];

            var teMaXiaoBox = '<div class="maXiaoBox"><div class="ma ' + colorArr[6] + '">' + showTeMa + '</div><div class="xiao">' + xiaoArr[6] + '</div></div>';

            var lineBoxHtml = '<div class="lineBox"><div class="centerCenter"><div class="time">' + date + '</div><div class="detailTime hidden"><div>开奖时间:</div><div>' + date + '</div><div>星期' + week + '</div></div></div><div class="centerCenter">' + qiNum + '期</div><div>' + maXiaoBoxArr + '</div><div class="centerCenter">' + teMaXiaoBox + '</div></div>';

            lineBoxHtmlArr.push(lineBoxHtml);

        }

        var lineBoxHtmlArrStr = '';

        for (var i = 0; i < lineBoxHtmlArr.length; i++) {

            lineBoxHtmlArrStr += lineBoxHtmlArr[i]

        }

        return lineBoxHtmlArrStr;

    }


    function lookWay(index) {

        setBottomBoxInnerHTML();

        setTimeout(function () {
            lookWay2(index);
        }, 1);


    }


    function lookWay2(index) {

        var wayDomArr = document.querySelectorAll('#saveAoMenRecordcontainer .aoMenRecordcontainer .way');

        var inputDomArr = document.querySelectorAll('#saveAoMenRecordcontainer .aoMenRecordcontainer input');

        var maDomArr = document.querySelectorAll('#saveAoMenRecordcontainer .aoMenRecordcontainer .ma');

        var xiaoDomArr = document.querySelectorAll('#saveAoMenRecordcontainer .aoMenRecordcontainer .xiao');

        for (var i = 0; i < inputDomArr.length; i++) {

            inputDomArr[i].checked = false;

            wayDomArr[i].classList.remove('activeWay');

        }

        inputDomArr[index].checked = true;

        wayDomArr[index].classList.add('activeWay');

        if (index == 0) {

            for (var i = 0; i < maDomArr.length; i++) {

                maDomArr[i].classList.remove('hidden');

                xiaoDomArr[i].classList.remove('hidden');

            }


        } else if (index == 1) {

            for (var i = 0; i < maDomArr.length; i++) {

                maDomArr[i].classList.add('hidden');

                xiaoDomArr[i].classList.remove('hidden');

            }


        } else if (index == 2) {

            for (var i = 0; i < maDomArr.length; i++) {

                maDomArr[i].classList.remove('hidden');

                xiaoDomArr[i].classList.add('hidden');

            }


        }

    }


    function mouseOverOut() {

        var lineBoxArr = document.querySelectorAll('#saveAoMenRecordcontainer .aoMenRecordcontainer  .lineBox');

        for (var i = 0; i < lineBoxArr.length; i++) {

            lineBoxArr[i].onmouseover = function () {

                this.querySelector('.time').classList.add('hidden');

                this.querySelector('.detailTime').classList.remove('hidden');

            };

            lineBoxArr[i].onmouseout = function () {

                this.querySelector('.time').classList.remove('hidden');

                this.querySelector('.detailTime').classList.add('hidden');

            };

        }

    }


    function getXiaoArrByMaArr(maArr, time) {

        var maFindXiaoOfYear = maFindXiao(time);


        var xiaoArr = [];

        for (var i = 0; i < maArr.length; i++) {

            xiaoArr.push(maFindXiaoOfYear[maArr[i]]);

        }

        return xiaoArr;

    }


    function getColorArrByMaArr(maArr) {

        var colorArr = [];

        for (var i = 0; i < maArr.length; i++) {

            colorArr.push(getColorByMa(maArr[i]));

        }

        return colorArr;

    }


    function getColorByMa(ma) {

        for (var attr in colorFindMa) {

            for (var i = 0; i < colorFindMa[attr].length; i++) {

                if (Number(colorFindMa[attr][i]) === ma) {

                    return attr;

                }

            }

        }

    }


    function IsPC() {

        var userAgentInfo = navigator.userAgent;

        var Agents = ["Android", "iPhone", "SymbianOS", "Windows Phone", "iPod"];

        var flag = true;

        for (var v = 0; v < Agents.length; v++) {

            if (userAgentInfo.indexOf(Agents[v]) > 0) {

                flag = false;

                break;

            }

        }

        if (window.screen.width >= 768) {

            flag = true;

        }

        return flag;

    }

    function getParams(variable)
    {
        var query = window.location.search.substring(1);
        var vars = query.split("&");
        for (var i=0;i<vars.length;i++) {
            var pair = vars[i].split("=");
            if(pair[0] == variable){return pair[1];}
        }
        return(false);
    }
</script>
</body>
