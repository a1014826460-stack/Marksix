
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "/www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="/www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="keywords" content="台湾金手指,www.twjsz666.com,彩票娱乐,开奖记录,预测资料">
    <meta name="description" content="台湾金手指提供分类整理的彩票资料与开奖记录，站点域名：www.twjsz666.com">
    <style>
        body{background: #fff}
    </style>
</head>

<body data-site-key="twjsz666" data-page-title="开奖切换">
<script src="site-config.js"></script>
<script src="subpage-data-adapter.js" defer></script>
<script src="/vendor/_shared/lottery-site-data-client.js"></script>

<style type="text/css">
    .KJ-TabBox ul,.KJ-TabBox li{margin:0;list-style:none;padding:0;border:0;font-size: 14px;}
    .KJ-TabBox li{display:inline-block;border:1px solid darkgrey;padding:5px;border-bottom:0;color:darkgrey;cursor:pointer;}
    .KJ-TabBox li{border-left:none;}
    .KJ-TabBox li:first-child{border-left:solid 1px;}
    .KJ-TabBox li.cur{color:limegreen;font-weight:bold;background-color:white;cursor:default;border-color:limegreen;border-left:solid 1px;border-right:solid 1px;}
    .KJ-TabBox div{border:1px solid gainsboro;margin-top:-1px;display:none;}
    .KJ-TabBox div.cur{display:block!important;border-color:limegreen;}
    .KJ-TabBox .KJ-IFRAME{background:white;}
</style>
<div class="KJ-TabBox">
    <ul>
        <li data-lottery-type="3" data-opt="{'color':'#ff6c02','url':'/vendor/twjsz666/wylhc.html?lottery_type=3','height':190}">
            台湾彩
    </li><li data-lottery-type="2" data-opt="{'color':'#ff6c02','url':'/vendor/twjsz666/wylhc.html?lottery_type=2','height':190}">
        澳门彩
    </li><li data-lottery-type="1" data-opt="{'color':'#ff6c02','url':'/vendor/twjsz666/wylhc.html?lottery_type=1','height':190}">
        香港彩
    </li>
    </ul>
    <div><span data-draw-value>加载开奖资料中</span></div>
    <div><span data-draw-value>加载开奖资料中</span></div>
    <div><span data-draw-value>加载开奖资料中</span></div>
</div>
<script>
    var KJTB ={
        $(str){return document.querySelector(str);},
        init(str){
            var that = this;
            var dom = this.$(str);
            dom.addEventListener("click",function(e){
                var el = e.target;
                if(el.tagName != "LI"||el.className=="cur")return;
                var ind = that.index(el);
                var nodes = dom.querySelectorAll("li");
                for(var item of nodes){
                    item.removeAttribute("style");
                    item.removeAttribute("class");
                }
                el.className="cur";
                nodes = dom.querySelectorAll("div");
                for(var item of nodes){
                    if(item.getAttribute("class")=="cur") that.leave(item);
                    item.removeAttribute("style");
                    item.removeAttribute("class");
                }
                var node = dom.querySelectorAll(':scope > div')[ind];
                node.className="cur";
                that.cur(dom,el,node);
            });
            var node = that.getEl(dom.querySelector("UL"),0,"LI");
            node.click();
            [[document,"DOMContentLoaded"],[window,"resize"]].forEach((item,index,self)=>{
                var removeEl=(id)=>{
                    try{
                        var ifr = document.getElementById(id);
                        ifr.parentNode.removeChild(ifr);
                    }catch(e){}
                };
                var insert = (id,str)=>{
                    var dom = document.createElement("style");
                    dom.id = id;
                    dom.innerHTML = str;
                    document.head.appendChild(dom);
                }
                item[0].addEventListener(item[1],function(){
                    removeEl("kj-iframe-css");
                    var w = window.screen.availWidth;
                    if(w<=650 && w>500){
                        insert("kj-iframe-css",".KJ-IFRAME{height:175px;}");
                    }else if(w<=500 && w>450){
                        insert("kj-iframe-css",".KJ-IFRAME{height:165px;}");
                    }else if(w<=450 && w>350){
                        insert("kj-iframe-css",".KJ-IFRAME{height:155px;}");
                    }else if(w<=350){
                        insert("kj-iframe-css",".KJ-IFRAME{height:135px;}");
                    }else{
                        insert("kj-iframe-css",".KJ-IFRAME{height:165px;}");
                    }
                },false);
            });
        },
        cur(dom,el,node){
            var that = this;
            var data = el.getAttribute('data-opt');
            data = JSON.parse(data.replace(/'/g,"\""));
            el.style.color = data["color"];
            el.style.borderColor = data["color"];
            node.style.borderColor = data["color"];

            // The panel itself is the site-owned draw slot; do not overlay it
            // with a second history iframe that hides the selected result.
        },
        leave(item){
            var that = this;
            function remove(el){
                this.id = setTimeout(()=>{
                    if(!el.getAttribute("_tid")) return;
                    el.removeAttribute("_tid");
                    el.innerHTML="";
                },1000*10);
                el.setAttribute("_tid",this.id);
            }
            new remove(item);
        },
        index(el,tag){
            var node = el.parentNode.childNodes;
            var index = -1;
            for(var item of node){
                (tag) ? (tag==item.tagName) && index++ : index++;
                if (item===el) return index;
            }
            return index;
        },
        getEl(el,index,tag){
            var i = -1;
            for(var item of el.childNodes){
                (tag) ? (tag==item.tagName) && i++ : i++;
                if(index==i) return item;
            }
        }
    };
    KJTB.init(".KJ-TabBox");
</script>
</body>
</html>
