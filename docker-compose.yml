# ============================================================
# 六合彩彩票数据管理系统 - Docker Compose
# 适用于 Ubuntu 24.04 LTS 部署
# ============================================================

services:
  mihomo:
    image: metacubex/mihomo:latest
    container_name: liuhecai-mihomo
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/mihomo/entrypoint.sh"]
    environment:
      DRAW_PROXY_SUBSCRIPTION_URL: "${DRAW_PROXY_SUBSCRIPTION_URL:-}"
    volumes:
      - ./deploy/mihomo:/etc/mihomo:ro
    networks:
      - liuhecai-network

  redis:
    image: redis:7.4-alpine
    container_name: liuhecai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - liuhecai-network

  postgres:
    image: postgres:17
    container_name: liuhecai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: liuhecai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/data:/data:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d liuhecai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - liuhecai-network

  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    container_name: liuhecai-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRESQL_DATABASE: liuhecai
      PGBOUNCER_DATABASE: liuhecai
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-1200}"
      PGBOUNCER_DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE:-50}"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "127.0.0.1:6432:6432"
    networks:
      - liuhecai-network

  python-api:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    container_name: liuhecai-python-api
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      LOTTERY_DB_PATH: "postgresql://postgres:${POSTGRES_PASSWORD:-change_me_in_production}@pgbouncer:6432/liuhecai"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-change_me_in_production}@pgbouncer:6432/liuhecai"
      LIUHECAI_RUNTIME_ENV: "production"
      CACHE_BACKEND: "redis"
      REDIS_URL: "redis://redis:6379/0"
      POSTGRES_POOL_MAX_SIZE: "${POSTGRES_POOL_MAX_SIZE:-120}"
      POSTGRES_POOL_TIMEOUT: "${POSTGRES_POOL_TIMEOUT:-15}"
      LOTTERY_API_HOST: "0.0.0.0"
      LOTTERY_API_PORT: "8000"
      DRAW_HK_BACKUP_COLLECT_URL: "${DRAW_HK_BACKUP_COLLECT_URL:-}"
      DRAW_MACAU_BACKUP_COLLECT_URL: "${DRAW_MACAU_BACKUP_COLLECT_URL:-}"
      DRAW_HK_BACKUP2_COLLECT_URL: "${DRAW_HK_BACKUP2_COLLECT_URL:-}"
      DRAW_MACAU_BACKUP2_COLLECT_URL: "${DRAW_MACAU_BACKUP2_COLLECT_URL:-}"
      DRAW_PROXY_URL: "${DRAW_PROXY_URL:-}"
      DRAW_HK_MACAU_MIN_REQUEST_INTERVAL_SECONDS: "${DRAW_HK_MACAU_MIN_REQUEST_INTERVAL_SECONDS:-10}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; resp = urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5); assert resp.status == 200\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - liuhecai-network

  scheduler-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    container_name: liuhecai-scheduler-worker
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    command: ["sh", "-c", "cd /app/src && python -m scheduler_worker"]
    environment:
      LOTTERY_DB_PATH: "postgresql://postgres:${POSTGRES_PASSWORD:-change_me_in_production}@pgbouncer:6432/liuhecai"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-change_me_in_production}@pgbouncer:6432/liuhecai"
      LIUHECAI_RUNTIME_ENV: "production"
      CACHE_BACKEND: "redis"
      REDIS_URL: "redis://redis:6379/0"
      POSTGRES_POOL_MAX_SIZE: "${POSTGRES_POOL_MAX_SIZE:-120}"
      POSTGRES_POOL_TIMEOUT: "${POSTGRES_POOL_TIMEOUT:-15}"
      DRAW_HK_BACKUP_COLLECT_URL: "${DRAW_HK_BACKUP_COLLECT_URL:-}"
      DRAW_MACAU_BACKUP_COLLECT_URL: "${DRAW_MACAU_BACKUP_COLLECT_URL:-}"
      DRAW_HK_BACKUP2_COLLECT_URL: "${DRAW_HK_BACKUP2_COLLECT_URL:-}"
      DRAW_MACAU_BACKUP2_COLLECT_URL: "${DRAW_MACAU_BACKUP2_COLLECT_URL:-}"
      DRAW_PROXY_URL: "${DRAW_PROXY_URL:-}"
      DRAW_HK_MACAU_MIN_REQUEST_INTERVAL_SECONDS: "${DRAW_HK_MACAU_MIN_REQUEST_INTERVAL_SECONDS:-10}"
    volumes:
      - ./backend/data:/app/data
      - ${BACKUP_DIR:-./backend/data/backups}:/app/data/backups
    networks:
      - liuhecai-network

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    container_name: liuhecai-db-migrate
    restart: "no"
    depends_on:
      pgbouncer:
        condition: service_started
    command: ["sh", "-c", "cd /app/src && python -m database.versioned_migrations --db-path \"$$DATABASE_URL\""]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-change_me_in_production}@pgbouncer:6432/liuhecai"
      LIUHECAI_RUNTIME_ENV: "production"
      POSTGRES_POOL_MAX_SIZE: "${POSTGRES_POOL_MAX_SIZE:-120}"
      POSTGRES_POOL_TIMEOUT: "${POSTGRES_POOL_TIMEOUT:-15}"
    networks:
      - liuhecai-network

  backend-admin:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: liuhecai-backend-admin
    restart: unless-stopped
    depends_on:
      - python-api
    environment:
      PYTHON_API_BASE_URL: "http://python-api:8000"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3002/fackyou/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - liuhecai-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: liuhecai-frontend
    restart: unless-stopped
    depends_on:
      - python-api
    environment:
      LOTTERY_BACKEND_BASE_URL: "http://python-api:8000/api"
      LOTTERY_SITE_ID: "${LOTTERY_SITE_ID:-1}"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - liuhecai-network

  nginx:
    image: nginx:1.27-alpine
    container_name: liuhecai-nginx
    restart: unless-stopped
    depends_on:
      python-api:
        condition: service_healthy
      backend-admin:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF_SOURCE:-./deploy/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    networks:
      - liuhecai-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  liuhecai-network:
    driver: bridge
