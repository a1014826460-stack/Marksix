# Frontend-only node reverse proxy. Dynamic routes are fulfilled by the
# Next.js service, which fetches the central API from www.tw8800.com.
# Docker Compose DNS: resolve service names dynamically on IP change
resolver 127.0.0.11 valid=10s;
map "" $be_frontend { default "frontend:3000"; }

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 1m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /health {
        proxy_pass http://$be_frontend/health;
        access_log off;
    }

    location / {
        proxy_pass http://$be_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
