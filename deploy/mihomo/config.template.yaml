mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning
external-controller: 0.0.0.0:9090

# 订阅源 47.112.97.173:5000 从本机不可达；改为静态 file provider，
# 节点由离线导入 deploy/mihomo/proxies/upstream.yaml（转换自 base64 订阅），
# 经 compose 挂载到 mihomo home(/tmp) 下的 /tmp/proxies。
proxy-providers:
  upstream:
    type: file
    path: /tmp/proxies/upstream.yaml
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204

proxy-groups:
  - name: draw-upstream
    type: url-test
    use:
      - upstream
    url: https://www.gstatic.com/generate_204
    interval: 300

rules:
  - MATCH,draw-upstream
