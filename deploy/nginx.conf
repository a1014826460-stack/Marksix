# ============================================================
# Default Nginx reverse proxy config
# - HTTP only
# - Works with server IP out of the box
# - HTTPS/domain binding is configured separately
# ============================================================

limit_req_zone $binary_remote_addr zone=admin_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=per_client:10m;

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 1m;
    limit_conn per_client 30;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ---- Compatibility health check: proxy to Python API ----
    location /health {
        proxy_pass http://python-api:8000/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Process-only probe for Docker/container supervision.
    location = /health/live {
        proxy_pass http://python-api:8000/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Dependency-aware probe for load balancers; it returns 503 when unavailable.
    location = /health/ready {
        proxy_pass http://python-api:8000/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Raw central API for frontend-only nodes. The existing /api/ prefix is
    # reserved for this site's Next.js compatibility routes, so it cannot be
    # used as the cross-node Python API address.
    location ^~ /central-api/api/ {
        proxy_pass http://python-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Central image source for frontend-only nodes; files are never copied
    # into those nodes so every visitor receives the current central asset.
    location ^~ /central-api/uploads/ {
        proxy_pass http://python-api:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Frontend Next.js API proxy ----
    # 所有 /api/* 请求代理到 Next.js 前端，由其兼容层分发：
    #   /api/kaijiang/*      → app/api/kaijiang/[...path]/route.ts  (预测资料)
    #   /api/index/notice    → app/api/index/notice/route.ts         (公告弹窗)
    #   /api/post/getList    → app/api/post/getList/route.ts         (推荐列表)
    #   /api/latest-draw     → app/api/latest-draw/route.ts          (最新开奖)
    #   /api/lottery-data    → app/api/lottery-data/route.ts         (站点首页)
    #   /api/predict/*       → app/api/predict/[mechanism]/route.ts  (执行预测)
    #   /api/draw-history    → app/api/draw-history/route.ts         (历史开奖)
    #   /api/next-draw-deadline → app/api/next-draw-deadline/route.ts (下期截止)
    #
    # Next.js 兼容层再代理到 Python 后端 (端口 8000)：
    #   /api/legacy/module-rows  → Python 查询 mode_payload_* 表
    #   /api/public/notice       → Python 读取 managed_sites.announcement
    location /api/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Next.js admin interface ----
    location = /fackyou/api/python/auth/captcha {
        limit_req zone=admin_auth burst=5 nodelay;
        proxy_pass http://backend-admin:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /fackyou/api/python/auth/login {
        limit_req zone=admin_auth burst=5 nodelay;
        proxy_pass http://backend-admin:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /fackyou {
        proxy_pass http://backend-admin:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fackyou/ {
        proxy_pass http://backend-admin:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static assets ----
    location /uploads/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
